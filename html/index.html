<body>
  <header class="site-header">
    <nav class="container">
      <a href="#/" class="logo-link" data-link><img src="../imagens/logo.png" alt="Logotipo do Instituto Vida Nova"></a>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="menu-principal">
        <span aria-hidden="true">&#9776;</span>
        <span class="sr-only">Abrir menu</span>
      </button>
      <ul class="nav-menu" id="menu-principal">
        <li><a href="#/" data-link data-route="">Início</a></li>
        <li class="nav-item">
          <button type="button" class="dropdown-toggle" aria-expanded="false">
            Como ajudar <span aria-hidden="true">&#9662;</span>

          <ul class="dropdown-menu">
            <li><a href="#/projetos/doacao" data-link>Como doar</a></li>

          </ul>

        <li><a href="#/inscritos" data-link data-route="inscritos">Inscritos</a></li>

      <p id="modal-texto">Obrigado por apoiar o Instituto Vida Nova. Em breve nossa equipe entrará em contato.</p>
      <button type="button" class="btn btn-primary" id="modal-fechar">Fechar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/imask@7/dist/imask.min.js"></script>
  <script src="../js/modules/storage.js"></script>
  <script src="../js/modules/mascaras.js"></script>
  <script src="../js/modules/validacao.js"></script>
  <script src="../js/templates/home.js"></script>

  <script src="../js/templates/inscritos.js"></script>
